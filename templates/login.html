<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operator Sign In — BullyMail V2 SOC</title>
    
    <!-- Favicon & Apple Touch Icon -->
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}?v=2.7.2">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon.png') }}?v=2.7.2">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='apple-touch-icon.png') }}?v=2.7.2">

    <!-- Early 2-State Theme Execution -->
    <script>
        (function() {
            const saved = localStorage.getItem('bullymail_theme');
            const theme = (saved === 'light' || saved === 'dark') ? saved : 'dark';
            document.documentElement.setAttribute('data-theme', theme);
            document.documentElement.style.colorScheme = theme;
        })();
    </script>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- FontAwesome 6 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <!-- BullyMail V2 Core CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}?v=2.6.1">
    <!-- Theme Core -->
    <script src="{{ url_for('static', filename='js/core/theme.js') }}?v=2.6.1"></script>
    
    <style>
        body {
            background-color: var(--bg-canvas);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
            font-family: 'Inter', sans-serif;
        }

        .auth-card-v2 {
            max-width: 410px;
            width: 100%;
            background: var(--bg-surface-elevated);
            border: 1px solid var(--neu-rim);
            border-radius: 24px;
            box-shadow: var(--neu-raised);
            padding: 34px;
            position: relative;
            overflow: hidden;
        }

        @media (max-width: 480px) {
            body {
                padding: 16px 12px;
            }
            .auth-card-v2 {
                padding: 24px 18px;
                border-radius: 18px;
            }
        }

        .auth-header-v2 {
            text-align: center;
            margin-bottom: 24px;
        }

        .auth-brand-logo {
            width: 72px;
            height: 72px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            background: transparent;
            border: none;
            box-shadow: none;
        }

        .auth-brand-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 4px 14px rgba(245, 158, 11, 0.45));
            transition: transform var(--transition-fast, 0.15s ease);
        }

        .auth-brand-logo:hover img {
            transform: scale(1.08);
        }

        .auth-title {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.01em;
            margin-bottom: 4px;
        }

        .auth-subtitle {
            font-size: 0.84rem;
            color: var(--text-secondary);
            margin-bottom: 0;
        }

        .back-nav-link {
            position: absolute;
            top: 24px;
            left: 24px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.84rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: var(--transition-fast);
            z-index: 10;
        }

        .back-nav-link:hover {
            color: var(--text-primary);
        }

        .top-right-theme-toggle {
            position: absolute;
            top: 24px;
            right: 24px;
            z-index: 10;
        }

        .form-control-auth {
            height: 46px;
            font-size: 0.88rem;
            border-radius: 12px;
            border: 1px solid var(--neu-rim-subtle);
            background: var(--bg-inset);
            color: var(--text-primary);
            padding: 0 16px;
            box-shadow: var(--neu-inset);
            transition: all var(--transition-fast);
        }

        .form-control-auth:focus {
            border-color: var(--accent-primary);
            box-shadow: var(--neu-inset), 0 0 0 2px var(--accent-glow);
            background: var(--bg-inset);
            color: var(--text-primary);
        }

        .auth-label {
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .btn-auth-primary {
            height: 46px;
            font-size: 0.92rem;
            font-weight: 700;
            border-radius: 12px;
            background: var(--accent-primary);
            border: 1px solid var(--neu-rim);
            color: #ffffff;
            box-shadow: var(--neu-btn);
            transition: all var(--transition-fast);
        }

        .btn-auth-primary:hover {
            box-shadow: var(--neu-btn-hover);
            color: #ffffff;
            transform: translateY(-1px);
        }

        .btn-auth-primary:active {
            box-shadow: var(--neu-btn-pressed) !important;
            transform: translateY(1px) scale(0.98);
        }
    </style>
</head>
<body>
    <a href="/" class="back-nav-link">
        <i class="fas fa-arrow-left"></i> Back to overview
    </a>

    <!-- Single-Click Theme Toggle -->
    <div class="top-right-theme-toggle">
        <button type="button" class="soc-theme-toggle-btn" aria-label="Switch to light mode" title="Switch to light mode">
            <i class="fas fa-sun"></i>
        </button>
    </div>

    <div class="auth-card-v2">
        <div class="auth-header-v2">
            <div class="auth-brand-logo">
                <img src="{{ url_for('static', filename='img/logo.png') }}?v=2.7.2" alt="BullyMail Logo">
            </div>
            <div class="text-muted small fw-semibold mb-1" style="font-size: 0.76rem; letter-spacing: 0.04em;">BULLYMAIL V2 SOC</div>
            <h1 class="auth-title">Operator Sign In</h1>
            <p class="auth-subtitle">Access the BullyMail security operations console.</p>
        </div>

        {% if error %}
        <div class="alert alert-danger d-flex align-items-center mb-3 py-2 px-3" style="font-size: 0.84rem; border-radius: 6px;" role="alert">
            <i class="fas fa-exclamation-circle me-2"></i>
            <div>{{ error }}</div>
        </div>
        {% endif %}

        {% if success %}
        <div class="alert alert-success d-flex align-items-center mb-3 py-2 px-3" style="font-size: 0.84rem; border-radius: 6px;" role="alert">
            <i class="fas fa-check-circle me-2"></i>
            <div>{{ success }}</div>
        </div>
        {% endif %}

        <form method="POST" action="/login">
            <div class="mb-3">
                <label class="auth-label" for="username">Username or Email</label>
                <input type="text" class="form-control form-control-auth" id="username" name="username" placeholder="e.g. admin or operator@org.com" required autofocus>
            </div>

            <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <label class="auth-label mb-0" for="password">Password</label>
                    <a href="/forgot-password" class="text-decoration-none text-muted" style="font-size: 0.78rem;">Forgot password?</a>
                </div>
                <div class="position-relative">
                    <input type="password" class="form-control form-control-auth pe-5" id="password" name="password" placeholder="••••••••••••" required>
                    <button class="btn btn-link text-muted position-absolute end-0 top-0 bottom-0 px-3 text-decoration-none" type="button" id="togglePasswordBtn" style="z-index: 5;">
                        <i class="fas fa-eye" id="togglePasswordIcon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-auth-primary w-100 mt-2">
                Sign In
            </button>

            <div class="text-center mt-3 small text-muted" style="font-size: 0.82rem;">
                Don't have an operator account? <a href="/signup" class="text-decoration-none text-primary fw-medium">Register here</a>
            </div>
        </form>
    </div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const toggleBtn = document.getElementById('togglePasswordBtn');
            const passInput = document.getElementById('password');
            const passIcon = document.getElementById('togglePasswordIcon');
            
            if (toggleBtn && passInput && passIcon) {
                toggleBtn.addEventListener('click', () => {
                    const isPass = passInput.type === 'password';
                    passInput.type = isPass ? 'text' : 'password';
                    passIcon.className = isPass ? 'fas fa-eye-slash' : 'fas fa-eye';
                });
            }
        });
    </script>
</body>
</html>
