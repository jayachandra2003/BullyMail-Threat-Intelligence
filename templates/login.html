<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operator Sign In — BullyMail V2 SOC</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">

    <!-- Early 2-State Theme Execution -->
    <script>
        (function() {
            const saved = localStorage.getItem('bullymail_theme');
            const theme = (saved === 'light' || saved === 'dark') ? saved : 'dark';
            document.documentElement.setAttribute('data-theme', theme);
            document.documentElement.style.colorScheme = theme;
        })();
    </script>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- FontAwesome 6 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <!-- BullyMail V2 Core CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}?v=2.5.0">
    <!-- Theme Core -->
    <script src="{{ url_for('static', filename='js/core/theme.js') }}?v=2.5.0"></script>
    
    <style>
        body {
            background-color: var(--bg-app);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
            font-family: 'Inter', sans-serif;
        }

        [data-theme="light"] body {
            background-color: #f8fafc;
        }

        .auth-card-v2 {
            max-width: 410px;
            width: 100%;
            background: var(--bg-glass);
            backdrop-filter: blur(20px) saturate(170%);
            -webkit-backdrop-filter: blur(20px) saturate(170%);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-xl, 16px);
            box-shadow: inset 0 1px 0 var(--glass-specular-bright), 0 16px 40px -4px rgba(0, 0, 0, 0.45);
            padding: 34px;
            position: relative;
            overflow: hidden;
        }

        .auth-card-v2::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--cyan), var(--accent-primary), var(--purple));
        }

        [data-theme="light"] .auth-card-v2 {
            background: rgba(255, 255, 255, 0.9);
            border-color: #cbd5e1;
            box-shadow: inset 0 1px 0 #ffffff, 0 12px 32px rgba(15, 23, 42, 0.08);
        }

        @media (max-width: 480px) {
            body {
                padding: 16px 12px;
            }
            .auth-card-v2 {
                padding: 24px 18px;
                border-radius: 12px;
            }
        }

        .auth-header-v2 {
            text-align: center;
            margin-bottom: 24px;
        }

        .auth-brand-logo {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #6366f1 0%, #4338ca 100%);
            border-radius: 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: #ffffff;
            margin-bottom: 12px;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35), 0 0 18px var(--accent-glow);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .auth-title {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.01em;
            margin-bottom: 4px;
        }

        .auth-subtitle {
            font-size: 0.84rem;
            color: var(--text-secondary);
            margin-bottom: 0;
        }

        .back-nav-link {
            position: absolute;
            top: 24px;
            left: 24px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.84rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: var(--transition-fast);
            z-index: 10;
        }

        .back-nav-link:hover {
            color: var(--text-primary);
        }

        .top-right-theme-toggle {
            position: absolute;
            top: 24px;
            right: 24px;
            z-index: 10;
        }

        .form-control-auth {
            height: 44px;
            font-size: 0.88rem;
            border-radius: 8px;
            border: 1px solid var(--border-subtle);
            background: var(--bg-surface);
            color: var(--text-primary);
            padding: 0 14px;
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.2);
            transition: all var(--transition-fast);
        }

        [data-theme="light"] .form-control-auth {
            background: #ffffff;
            border-color: #cbd5e1;
            color: #0f172a;
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.04);
        }

        .form-control-auth:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25), 0 0 14px rgba(99, 102, 241, 0.2);
            background: var(--bg-surface);
            color: var(--text-primary);
        }

        .auth-label {
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        [data-theme="light"] .auth-label {
            color: #334155;
        }

        .btn-auth-primary {
            height: 44px;
            font-size: 0.92rem;
            font-weight: 600;
            border-radius: 8px;
            background: linear-gradient(180deg, #6366f1 0%, #4f46e5 100%);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #ffffff;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.32), 0 4px 14px rgba(79, 70, 229, 0.4);
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn-auth-primary:hover {
            background: linear-gradient(180deg, #7175f5 0%, #4338ca 100%);
            border-color: rgba(255, 255, 255, 0.3);
            color: #ffffff;
            transform: translateY(-1px);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.45), 0 6px 20px rgba(99, 102, 241, 0.55);
        }

        .btn-auth-primary:active {
            transform: translateY(1px) scale(0.98);
        }

        [data-theme="light"] .btn-auth-primary {
            background: linear-gradient(180deg, #4f46e5 0%, #4338ca 100%);
            border-color: rgba(79, 70, 229, 0.5);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35), 0 3px 10px rgba(79, 70, 229, 0.3);
        }

        [data-theme="light"] .btn-auth-primary:hover {
            background: linear-gradient(180deg, #4338ca 0%, #3730a3 100%);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.45), 0 6px 18px rgba(79, 70, 229, 0.4);
        }
    </style>
</head>
<body>
    <a href="/" class="back-nav-link">
        <i class="fas fa-arrow-left"></i> Back to overview
    </a>

    <!-- Single-Click Theme Toggle -->
    <div class="top-right-theme-toggle">
        <button type="button" class="soc-theme-toggle-btn" aria-label="Switch to light mode" title="Switch to light mode">
            <i class="fas fa-sun"></i>
        </button>
    </div>

    <div class="auth-card-v2">
        <div class="auth-header-v2">
            <div class="auth-brand-logo">
                <i class="fas fa-shield-halved"></i>
            </div>
            <div class="text-muted small fw-semibold mb-1" style="font-size: 0.76rem; letter-spacing: 0.04em;">BULLYMAIL V2 SOC</div>
            <h1 class="auth-title">Operator Sign In</h1>
            <p class="auth-subtitle">Access the BullyMail security operations console.</p>
        </div>

        {% if error %}
        <div class="alert alert-danger d-flex align-items-center mb-3 py-2 px-3" style="font-size: 0.84rem; border-radius: 6px;" role="alert">
            <i class="fas fa-exclamation-circle me-2"></i>
            <div>{{ error }}</div>
        </div>
        {% endif %}

        {% if success %}
        <div class="alert alert-success d-flex align-items-center mb-3 py-2 px-3" style="font-size: 0.84rem; border-radius: 6px;" role="alert">
            <i class="fas fa-check-circle me-2"></i>
            <div>{{ success }}</div>
        </div>
        {% endif %}

        <form method="POST" action="/login">
            <div class="mb-3">
                <label class="auth-label" for="username">Username or Email</label>
                <input type="text" class="form-control form-control-auth" id="username" name="username" placeholder="e.g. admin or operator@org.com" required autofocus>
            </div>

            <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <label class="auth-label mb-0" for="password">Password</label>
                    <a href="/forgot-password" class="text-decoration-none text-muted" style="font-size: 0.78rem;">Forgot password?</a>
                </div>
                <div class="position-relative">
                    <input type="password" class="form-control form-control-auth pe-5" id="password" name="password" placeholder="••••••••••••" required>
                    <button class="btn btn-link text-muted position-absolute end-0 top-0 bottom-0 px-3 text-decoration-none" type="button" id="togglePasswordBtn" style="z-index: 5;">
                        <i class="fas fa-eye" id="togglePasswordIcon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-auth-primary w-100 mt-2">
                Sign In
            </button>

            <div class="text-center mt-3 small text-muted" style="font-size: 0.82rem;">
                Don't have an operator account? <a href="/signup" class="text-decoration-none text-primary fw-medium">Register here</a>
            </div>
        </form>
    </div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const toggleBtn = document.getElementById('togglePasswordBtn');
            const passInput = document.getElementById('password');
            const passIcon = document.getElementById('togglePasswordIcon');
            
            if (toggleBtn && passInput && passIcon) {
                toggleBtn.addEventListener('click', () => {
                    const isPass = passInput.type === 'password';
                    passInput.type = isPass ? 'text' : 'password';
                    passIcon.className = isPass ? 'fas fa-eye-slash' : 'fas fa-eye';
                });
            }
        });
    </script>
</body>
</html>
